workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"
stages: [verify, govern, package]
default:
  image: node:22-alpine
  before_script:
    - npm ci
verify:
  stage: verify
  script:
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
policy:
  stage: govern
  script:
    - npm run policy
browser:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  script:
    - npm run test:browser
  artifacts:
    when: on_failure
    paths: [test-results/]
    expire_in: 3 days
container:
  stage: package
  image: docker:27-cli
  before_script: []
  services: [docker:27-dind]
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
  script:
    - docker build --tag aftergrowth:$CI_COMMIT_SHA .
protected-files:
  stage: govern
  image: node:22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - npx tsx scripts/governance.ts
dependency-audit:
  stage: govern
  script:
    - npm audit --audit-level=moderate
