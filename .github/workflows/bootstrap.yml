name: Bootstrap verification
on:
  push:
    branches: [feat/seed-habitat-lifecycle, main]
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm audit --audit-level=moderate
      - name: Secret detection (redacted)
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/gitleaks-checksums.txt
          cd /tmp
          python3 -c "import hashlib,pathlib; p=pathlib.Path('.'); expected=next(line.split()[0] for line in (p/'gitleaks-checksums.txt').read_text().splitlines() if line.endswith('gitleaks_8.30.1_linux_x64.tar.gz')); assert hashlib.sha256((p/'gitleaks_8.30.1_linux_x64.tar.gz').read_bytes()).hexdigest()==expected"
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --no-banner .
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install semgrep==1.179.0
      - run: semgrep scan --config p/typescript --config p/javascript --metrics off --disable-version-check --error src scripts public
      - name: Build and smoke OCI container locally on runner
        shell: bash
        run: |
          docker build --tag aftergrowth-bootstrap .
          docker run --detach --name aftergrowth-check --publish 127.0.0.1:8080:8080 aftergrowth-bootstrap
          trap 'docker rm --force aftergrowth-check' EXIT
          for attempt in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then break; fi
            sleep 1
          done
          npx tsx scripts/smoke.ts http://127.0.0.1:8080 gen-0000
